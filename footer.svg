<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1000" height="100" fill="#0D1117"/>
  <rect width="1000" height="100" fill="url(#dots)"/>
  <rect width="1000" height="3" fill="url(#edge)"/>

  <!-- heartbeat line -->
  <path d="M0,38 L380,38 L400,38 L415,14 L432,62 L448,24 L462,38 L1000,38" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0,38 L380,38 L400,38 L415,14 L432,62 L448,24 L462,38 L1000,38" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="160 840">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="84" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#9CA3AF">
    <tspan fill="#38BDF8">&lt;</tspan> thanks for stopping by <tspan fill="#F472B6">/&gt;</tspan>
  </text>
</svg>
