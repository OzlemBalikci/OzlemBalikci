<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" role="img" aria-label="Özlem Balıkçı, Flutter and Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="240" fill="#0D1117"/>
  <rect width="1000" height="240" fill="url(#dots)"/>

  <!-- drifting glows -->
  <circle cx="160" cy="70" r="90" fill="#38BDF8" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="160;260;160" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="180" r="90" fill="#A78BFA" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="840;740;840" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- left network -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M60,60 L130,120 L70,185"/>
    <path d="M130,120 L215,70"/>
    <path d="M130,120 L210,185"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="60" cy="60" r="4"/><circle cx="130" cy="120" r="5"/><circle cx="70" cy="185" r="4"/>
    <circle cx="215" cy="70" r="4"/><circle cx="210" cy="185" r="4"/>
  </g>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M60,60 L130,120 L215,70"/>
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M70,185 L130,120 L210,185"/>
  </circle>

  <!-- right network -->
  <g stroke="#F472B6" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M940,60 L870,120 L930,185"/>
    <path d="M870,120 L785,70"/>
    <path d="M870,120 L790,185"/>
  </g>
  <g fill="#F472B6">
    <circle cx="940" cy="60" r="4"/><circle cx="870" cy="120" r="5"/><circle cx="930" cy="185" r="4"/>
    <circle cx="785" cy="70" r="4"/><circle cx="790" cy="185" r="4"/>
  </g>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M785,70 L870,120 L940,60"/>
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="4.5s" begin="0.5s" repeatCount="indefinite" path="M790,185 L870,120 L930,185"/>
  </circle>

  <!-- title -->
  <text x="500" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)">
    Özlem Balıkçı
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- terminal style subtitle -->
  <text x="500" y="165" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9CA3AF">
    <tspan fill="#38BDF8">&gt;</tspan> Flutter · Spring Boot · Redis · Kafka · RabbitMQ<tspan fill="#F472B6">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- top and bottom edge -->
  <rect width="1000" height="3" fill="url(#edge)"/>
  <rect y="237" width="1000" height="3" fill="url(#edge)"/>
</svg>
